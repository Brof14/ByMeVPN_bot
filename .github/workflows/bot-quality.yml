name: Bot quality
on:
  push:
    branches: [main, 'ux/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --strict
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Run regression tests with worker diagnostics
        run: |
          python -c '
          import faulthandler, runpy, sys, threading
          faulthandler.dump_traceback_later(60, repeat=False)
          try:
              runpy.run_module("unittest", run_name="__main__")
          except SystemExit:
              faulthandler.cancel_dump_traceback_later()
              threads = [t for t in threading.enumerate() if t is not threading.current_thread() and not t.daemon]
              print("Non-daemon threads after unittest:", [(t.name, t.ident) for t in threads], file=sys.stderr)
              faulthandler.dump_traceback(file=sys.stderr)
              raise
          ' discover -s tests -p 'test_*.py' -q

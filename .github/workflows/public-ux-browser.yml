name: Public UX browser checks

on:
  pull_request:
    branches: [main]
    paths:
      - "templates/connect.html"
      - "app_links.py"
      - "static/app/index.html"
      - "static/app/assets/**"
      - "tests/visual/**"
      - ".github/workflows/public-ux-browser.yml"
  push:
    branches: [main]
    paths:
      - "templates/connect.html"
      - "app_links.py"
      - "static/app/index.html"
      - "static/app/assets/**"
      - "tests/visual/**"
      - ".github/workflows/public-ux-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-public-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app and browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "playwright>=1.52,<2"
          python -m playwright install --with-deps chromium
      - name: Verify public pages at phone and desktop viewports
        env:
          PYTHONPATH: "."
        run: python tests/visual/verify_public_pages.py
      - name: Upload screenshots for human UX review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-ui-screenshots
          path: artifacts/public-ui/*.png
          if-no-files-found: warn
          retention-days: 14

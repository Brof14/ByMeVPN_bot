name: Python tests

on:
  pull_request:
    branches:
      - main
      - "fix/**"
  push:
    branches:
      - main
      - "fix/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests with worker diagnostics
        run: |
          python -c '
          import faulthandler, runpy, sys, threading
          faulthandler.dump_traceback_later(60, repeat=False)
          try:
              runpy.run_module("unittest", run_name="__main__")
          except SystemExit:
              faulthandler.cancel_dump_traceback_later()
              threads = [t for t in threading.enumerate() if t is not threading.current_thread() and not t.daemon]
              print("Non-daemon threads after unittest:", [(t.name, t.ident) for t in threads], file=sys.stderr)
              faulthandler.dump_traceback(file=sys.stderr)
              raise
          ' discover -s tests -v

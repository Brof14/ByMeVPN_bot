name: Python tests

on:
  pull_request:
    branches:
      - main
      - "fix/**"
  push:
    branches:
      - main
      - "fix/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -c 'import faulthandler,runpy; faulthandler.dump_traceback_later(60, repeat=True); runpy.run_module("unittest", run_name="__main__")' discover -s tests -v

# Install as an sshd_config include only after creating the root-owned chroot
# and validating the effective sshd configuration. Workflow paths are relative
# to the chroot root, so internal-sftp starts in /.
Match User bymevpn-upload
    ChrootDirectory /srv/bymevpn-updates
    ForceCommand internal-sftp -d /
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    PubkeyAuthentication yes
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no

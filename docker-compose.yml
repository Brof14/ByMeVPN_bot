version: '3.8'

services:
  vpnbot:
    build: .
    container_name: vpnbot
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    # Set DOCKER_UID/DOCKER_GID to the owner of ./data on the host (usually 1000:1000).
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - ./data:/app/data

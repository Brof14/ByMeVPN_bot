services:
  redis:
    image: redis:7-alpine
    container_name: vpnbot-redis
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  vpnbot:
    build: .
    container_name: vpnbot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('WEBHOOK_PORT','8080')+'/readyz',timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
